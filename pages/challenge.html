<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../main.css">
    <title>Challenge</title>
    <style>
        body { display: flex; align-items: center; justify-content: center; height: 100vh; }
        .card { text-align: center; font-family: 'Trebuchet MS', sans-serif; }
        .card h1 { font-size: 2rem; margin-bottom: 1rem; }
        .card p { color: #555; margin-bottom: 1.5rem; }
        .card a {
            display: inline-block;
            background: #111;
            color: #fff;
            padding: 0.6rem 1.4rem;
            border-radius: 6px;
            text-decoration: none;
            font-size: 1rem;
        }
        .card a:hover { background: #333; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Challenge Tracker</h1>
        <p>The challenge tracker runs as a separate app.</p>
        <a href="http://localhost:3001" target="_blank">Open Challenge Tracker →</a>
    </div>
</body>
</html>
